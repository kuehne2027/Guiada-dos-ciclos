<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

colors:{ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',accent:'var(--accent)',glass:'var(--glass)'}}}}

<style>
/* Layout: nav fixa translúcida (estilo Apple) → Bento Grid de vidro sobre fundo com gradientes suaves; planta do galpão como bloco principal */
:root{
  --bg:#07090d; --ink:#eef2f5; --muted:#8c97a3; --line:rgba(255,255,255,.09); --glass:rgba(22,27,34,.55);
  --accent:#4cc3ff; --amber:#ffb547;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:Onest,system-ui,sans-serif;min-height:100%;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-14vw;background:#0e6d9c}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:18vh;background:#b86b12;opacity:.16}
.aurora i:nth-child(3){width:50vw;height:40vw;left:30vw;bottom:-22vw;background:#123f7a;opacity:.3}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}

.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.tnum{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.noscroll::-webkit-scrollbar{display:none}.noscroll{scrollbar-width:none}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}
</style>

<div class="aurora"><i></i><i></i><i></i></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ============ DADOS ============ */
const CARRIERS={
  AL:{n:"ALC",bg:"#111111",fg:"#ffffff"},
  EC:{n:"ECO EXPRESS",bg:"#f6e2c0",fg:"#1b1b1b"},
  MS:{n:"M.J SIMÕES",bg:"#8a8a8a",fg:"#ffffff"},
  HW:{n:"HAWK",bg:"#16357a",fg:"#ffffff"},
  ME:{n:"MELI EXTRA",bg:"#f4c7ad",fg:"#1b1b1b"},
  PL:{n:"PRALOG",bg:"#7b5ea7",fg:"#ffffff"},
  OT:{n:"ONTIME",bg:"#ffef2e",fg:"#1b1b1b"},
  PC:{n:"PARCEIRO",bg:"#ffffff",fg:"#1b1b1b"},
  KG:{n:"KANGU",bg:"#f39200",fg:"#1b1b1b"},
  DL:{n:"DELUNA",bg:"#4f7a2e",fg:"#ffffff"},
  CM:{n:"COOPMETRO",bg:"#22e024",fg:"#1b1b1b"},
  DC:{n:"DECARGO",bg:"#22e6ea",fg:"#1b1b1b"},
  PY:{n:"PY",bg:"#b8860b",fg:"#ffffff"},
  X:{n:"Bloqueada",bg:"#e5262a",fg:"#ffffff"},
  V:{n:"Vazia",bg:"#e9ecef",fg:"#8a929b"}
};
function fill(o,a,b,code,s=1){if(a<=b){for(let i=a;i<=b;i+=s)o[i]=code}else{for(let i=a;i>=b;i-=s)o[i]=code}return o}
const build=steps=>{const o={};steps.forEach(st=>fill(o,...st));return o};
const LAYOUTS={
  "AM0-CHP":{map:build([[1,31,"X",2],[2,4,"AL",2],[6,8,"CM",2],[10,20,"KG",2],[22,26,"MS",2],[28,34,"X",2],
    [35,43,"HW"],[44,44,"X"],[45,49,"OT"],[50,50,"X"],[51,52,"DC"],[53,53,"X"],[54,54,"EC"],[55,55,"X"],[56,56,"DL"],[57,65,"X"],
    [88,76,"X"],[75,75,"DL"],[74,72,"EC"],[71,71,"OT"],[70,69,"PC"],[68,67,"HW"],[66,66,"CM"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "AM":{map:build([[1,31,"ME",2],[2,8,"PC",2],[10,22,"KG",2],[24,34,"ME",2],
    [35,38,"PC"],[39,45,"DL"],[46,49,"MS"],[50,54,"AL"],[55,60,"DC"],[61,65,"X"],
    [88,79,"HW"],[78,74,"CM"],[73,73,"PY"],[72,69,"EC"],[68,66,"OT"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"Passeio",right:"VUC"}},
  "PM":{map:build([[1,9,"DC",2],[11,17,"MS",2],[19,23,"EC",2],[25,31,"CM",2],[2,4,"KG",2],[6,6,"PY"],[8,14,"OT",2],[16,22,"DL",2],[24,34,"PC",2],
    [35,39,"KG"],[40,65,"ME"],
    [88,83,"HW"],[82,81,"AL"],[80,77,"DL"],[76,76,"DC"],[75,75,"OT"],[74,74,"EC"],[73,72,"PC"],[71,66,"HW"],[89,97,"HW"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "SD":{map:build([[1,31,"X",2],[2,6,"DC",2],[8,8,"EC"],[10,14,"OT",2],[16,20,"MS",2],[22,34,"HW",2],
    [35,37,"PC"],[38,40,"DL"],[41,42,"CM"],[43,50,"KG"],[51,65,"X"],[88,66,"X"],[89,97,"X"]]),
    tags:{},
    tagBelow:true,veh:{top:"Passeio",bot:"—",right:"VUC"}}
};
const rua=v=>v<=34?(v%2?1:2):v<=65?3:v<=88?5:4;
const area=v=>["","Rua 1 · coluna esquerda (ímpares)","Rua 2 · coluna esquerda (pares)","Rua 3 · ao lado da esteira","Rua 4 · lado direito (VUC)","Rua 5 · frente do mezanino (expedição VUC)"][rua(v)];
const vehOf=(L,v)=>v<=34?"—":v<=65?L.veh.top:v<=88?L.veh.bot:L.veh.right;
const SZ=36,STEP=42;
function pos(v){
  if(v<=34){const r=Math.floor((v-1)/2);return{x:v%2?40:86,y:98+r*STEP}}
  if(v<=65)return{x:128+(v-35)*STEP,y:56};
  if(v<=88)return{x:204+(88-v)*STEP,y:606};
  return{x:1320,y:250+(v-89)*STEP};
}
const BLOCKS_DEF={
  rampaS:{x:10,y:8,w:80,h:40,t:"RAMPA\nSAÍDA"},rampaU:{x:1300,y:130,w:98,h:40,t:"RAMPA ↑"},rampaU1:{x:1300,y:760,w:98,h:44,t:"RAMPA ↑ 1"},
  est1:{x:250,y:214,w:1000,h:24,t:"ESTEIRA"},est2:{x:250,y:296,w:1000,h:24,t:"ESTEIRA"},mez:{x:250,y:388,w:480,h:58,t:"MEZANINO"},
  exp:{x:190,y:592,w:986,h:66,t:"",dashed:true}};
const TAGS_DEF={1:{x:36,y:70},2:{x:84,y:70},3:{x:128,y:4},4:{x:1316,y:222},5:{x:204,y:578}};
const CAPS_DEF={3:{x:200,y:140},5:{x:204,y:684},4:{x:1250,y:636}};
// onde fica o nome da gaiola/rota em relação à vaga (x = centro do rótulo, ou esquerda se side)
const shortTag=t=>String(t||"").replace(/_[A-Z]{2,4}\d*$/i,"");
function tagPlace(v,below,len){const r=rua(v);const two=len>5&&v%2===0;
  if(r===3)return below?{cx:SZ/2,y:SZ+3+(two?17:0)}:{cx:SZ/2,y:two?-35:-18};
  if(r===5)return{cx:SZ/2,y:SZ+3+(two?17:0)};
  if(r===1)return{left:true,y:SZ/2-8};
  return{side:true,x:SZ+4,y:SZ/2-8}}
function mergeGeo(p){p=p||{};const slots={};for(let v=1;v<=97;v++)slots[v]=(p.slots&&p.slots[v])||pos(v);
  const blocks={};Object.keys(BLOCKS_DEF).forEach(k=>blocks[k]={...BLOCKS_DEF[k],...((p.blocks||{})[k]||{})});
  const tags={},caps={};[1,2,3,4,5].forEach(n=>{tags[n]=(p.tags||{})[n]||TAGS_DEF[n];if(CAPS_DEF[n])caps[n]=(p.caps||{})[n]||CAPS_DEF[n]});
  return {slots,blocks,tags,caps}}
function geoBounds(G){let W=0,H=0;Object.values(G.slots).forEach(p=>{W=Math.max(W,p.x+SZ);H=Math.max(H,p.y+SZ)});
  Object.values(G.blocks).forEach(b=>{W=Math.max(W,b.x+b.w);H=Math.max(H,b.y+b.h)});Object.values(G.caps).forEach(c=>{W=Math.max(W,c.x+150);H=Math.max(H,c.y+16)});
  return {W:Math.max(W+12,400),H:Math.max(H+16,300)}}
const capText=(L,n)=>n===3?"Rua 3 · "+L.veh.top+"   ←   sentido de saída":n===5?"Rua 5 · Expedição VUC"+(L.veh.bot&&L.veh.bot!=="—"?" · "+L.veh.bot:""):"Rua 4 · "+L.veh.right;
function groups(L){const g={};Object.entries(L.map).forEach(([v,k])=>(g[k]=g[k]||[]).push(+v));Object.values(g).forEach(a=>a.sort((x,y)=>x-y));return g}
function ranges(arr){const out=[];let i=0;while(i<arr.length){let j=i;const step=(arr[i]<=34&&arr[i+1]-arr[i]===2)?2:1;
  while(j+1<arr.length&&arr[j+1]-arr[j]===step&&(step===1||arr[j+1]<=34))j++;
  out.push(j>i?`${arr[i]}–${arr[j]}${step===2?" (ímpar/par)":""}`:`${arr[i]}`);i=j+1}return out.join(", ")}

/* ============ UI ============ */
const {useState,useEffect,useRef,useMemo}=React;
const {motion,AnimatePresence,LayoutGroup}=Motion;
const html=htm.bind(React.createElement);
const spring={type:"spring",stiffness:420,damping:32};
const tactile={whileHover:{scale:1.03},whileTap:{scale:.96},transition:spring};
const stagger={hidden:{},show:{transition:{staggerChildren:.07,delayChildren:.05}}};
const rise={hidden:{opacity:0,y:18,filter:"blur(6px)"},show:{opacity:1,y:0,filter:"blur(0px)",transition:{duration:.55,ease:[.22,1,.36,1]}}};

function Swatch({k,size="sm"}){const c=CARRIERS[k];const cls=size==="lg"?"text-sm px-2.5 py-1 rounded-lg":"text-[10px] px-1.5 py-0.5 rounded-md";
  return html`<span class=${"font-mono font-bold inline-block "+cls} style=${{background:c.bg,color:c.fg,boxShadow:"inset 0 0 0 1px rgba(0,0,0,.25)"}}>${k}</span>`}

function Nav({cur,setCur,view,setView}){
  return html`<header class="fixed top-0 inset-x-0 z-50" style=${{paddingTop:"env(safe-area-inset-top,0px)"}}>
    <div class="glass !border-x-0 !border-t-0" style=${{background:"rgba(7,9,13,.62)"}}>
      <nav class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-4">
        <div class="flex items-center gap-2 shrink-0">
          <span class="w-2 h-2 rounded-full" style=${{background:"var(--accent)",boxShadow:"0 0 12px var(--accent)"}}></span>
          <span class="font-display text-[13px] tracking-tight">SVC<span class="text-muted font-sans font-medium"> · Layouts</span></span>
        </div>
        <${LayoutGroup} id="tabs">
          <div class="ml-auto flex gap-1 overflow-x-auto noscroll p-1 rounded-full" style=${{background:"rgba(255,255,255,.05)"}} role="tablist">
            ${Object.keys(LAYOUTS).map(k=>html`<${motion.button} key=${k} id=${"tab-"+k} role="tab" aria-selected=${k===cur} onClick=${()=>setCur(k)} ...${tactile}
              class=${"relative shrink-0 px-3.5 sm:px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors "+(k===cur?"text-black":"text-muted hover:text-ink")}>
              ${k===cur&&html`<${motion.span} layoutId="pill" class="absolute inset-0 rounded-full" style=${{background:"var(--ink)"}} transition=${spring}/>`}
              <span class="relative">${k}</span>
            </${motion.button}>`)}
          </div>
        </${LayoutGroup}>
      </nav>
      <div class="max-w-7xl mx-auto px-4 pb-2.5">
        <${LayoutGroup} id="views"><div class="inline-flex gap-1 p-1 rounded-full" style=${{background:"rgba(255,255,255,.05)"}}>
          ${[["planta","Layout e vagas"],["plan","Planejamento por rua"]].map(([id,t])=>html`<${motion.button} key=${id} id=${"view-"+id} ...${tactile} onClick=${()=>setView(id)}
            class=${"relative px-3.5 py-1.5 rounded-full text-[12px] font-medium "+(view===id?"text-[#04121b]":"text-muted hover:text-ink")}>
            ${view===id&&html`<${motion.span} layoutId="vpill" class="absolute inset-0 rounded-full" style=${{background:"var(--accent)"}} transition=${spring}/>`}
            <span class="relative">${t}</span></${motion.button}>`)}
        </div></${LayoutGroup}>
      </div>
    </div>
  </header>`;
}

function Card({className="",children,title,right}){
  return html`<${motion.section} variants=${rise} class=${"glass rounded-3xl p-5 sm:p-6 min-w-0 "+className}
      whileHover=${{y:-2}} transition=${{type:"spring",stiffness:300,damping:26}}>
    ${title&&html`<div class="flex items-center justify-between gap-3 mb-4"><h2 class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">${title}</h2>${right}</div>`}
    ${children}
  </${motion.section}>`;
}

function Skeleton(){
  const b=(c)=>html`<div class=${"glass rounded-3xl p-6 "+c}><div class="sk h-3 w-24 mb-5"></div><div class="sk h-8 w-2/3 mb-3"></div><div class="sk h-3 w-1/2"></div></div>`;
  return html`<div class="grid grid-cols-1 md:grid-cols-12 gap-4">
    ${b("md:col-span-8 h-48")}${b("md:col-span-4 h-48")}
    <div class="glass rounded-3xl p-6 md:col-span-12"><div class="sk h-3 w-32 mb-5"></div><div class="sk w-full" style=${{height:"min(52vw,560px)"}}></div></div>
    ${b("md:col-span-7 h-72")}${b("md:col-span-5 h-72")}
  </div>`;
}

function Hero({cur,L}){
  const g=groups(L);const total=Object.keys(L.map).length-(g.V||[]).length;const bloq=(g.X||[]).length;
  const n=Object.keys(g).filter(k=>k!=="X").length;
  const stat=(v,l,color)=>html`<div class="min-w-0"><div class="font-display text-3xl sm:text-4xl tnum" style=${{color}}>${v}</div><div class="text-muted text-xs mt-1">${l}</div></div>`;
  return html`<${Card} className="md:col-span-8">
    <div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Layout do SVC</div>
    <h1 class="font-display text-4xl sm:text-6xl tracking-tight mt-2 mb-6" style=${{textWrap:"balance"}}>
      <${AnimatePresence} mode="wait"><${motion.span} key=${cur} class="inline-block" initial=${{opacity:0,y:14}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:-14}} transition=${{duration:.3}}>${cur}</${motion.span}></${AnimatePresence}>
    </h1>
    <div class="grid grid-cols-3 gap-4 max-w-md">
      ${stat(total-bloq,"vagas ativas","var(--ink)")}
      ${stat(bloq,"bloqueadas (X)","#ff6b6e")}
      ${stat(n,"transportadoras","var(--accent)")}
    </div>
  </${Card}>`;
}

function Search({L,onPick}){
  const [q,setQ]=useState("");const v=parseInt(q,10);const k=L.map[v];
  return html`<${Card} className="md:col-span-4" title="Buscar vaga">
    <label for="busca" class="sr-only">Número da vaga</label>
    <input id="busca" inputmode="numeric" value=${q} onInput=${e=>{setQ(e.target.value.replace(/\D/g,"").slice(0,2));const n=parseInt(e.target.value,10);if(L.map[n])onPick(n)}}
      placeholder="Ex.: 73" class="w-full bg-white/5 border border-line rounded-2xl px-4 py-3 font-display text-2xl tnum placeholder:text-white/20 outline-none focus:border-[var(--accent)] transition-colors"/>
    <div class="mt-4 min-h-[72px]">
      <${AnimatePresence} mode="wait">
        ${k?html`<${motion.div} key=${v+k} initial=${{opacity:0,scale:.96}} animate=${{opacity:1,scale:1}} exit=${{opacity:0}} class="flex items-center gap-3">
            <${Swatch} k=${k} size="lg"/>
            <div class="min-w-0"><div class="font-semibold">${CARRIERS[k].n}</div><div class="text-muted text-xs">${area(v)} · ${vehOf(L,v)}</div></div>
          </${motion.div}>`
        :html`<${motion.p} key="empty" initial=${{opacity:0}} animate=${{opacity:1}} class="text-muted text-sm">${q?"Essa vaga não existe neste layout.":"Digite o número (1 a 97) para ver a transportadora."}</${motion.p}>`}
      </${AnimatePresence}>
    </div>
  </${Card}>`;
}

/* ============ IMAGEM DO LAYOUT (WhatsApp) ============ */
async function renderLayoutPNG(cur,L){
  try{await document.fonts.ready}catch(e){}
  const G=L.geo,{W:MW,H:MH}=geoBounds(G);
  const K=2,PAD=24,TOP=78,LEG_H=36;
  const counts={};Object.values(L.map).forEach(k=>counts[k]=(counts[k]||0)+1);
  const legend=Object.keys(CARRIERS).filter(k=>counts[k]);
  const cols=5,legRows=Math.ceil(legend.length/cols);
  const W=MW+PAD*2,H=TOP+MH+28+legRows*LEG_H+PAD+44;
  const cv=document.createElement("canvas");cv.width=W*K;cv.height=H*K;const g=cv.getContext("2d");g.scale(K,K);
  const F=(w,s)=>`${w} ${s}px Onest, Arial, sans-serif`;
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  g.fillStyle="#ffffff";g.fillRect(0,0,W,H);
  g.fillStyle="#111";g.font=F(800,28);g.textAlign="center";g.textBaseline="alphabetic";g.fillText("LAYOUT DO SVC - "+cur,W/2,42);
  g.font=F(500,14);g.fillStyle="#555";g.fillText(new Date().toLocaleDateString("pt-BR")+"  ·  Kuehne+Nagel · Meli",W/2,63);
  g.save();g.translate(PAD,TOP);
  g.strokeStyle="#222";g.lineWidth=1.5;g.strokeRect(0,0,MW,MH);
  Object.values(G.blocks).forEach(b=>{if(b.dashed){g.strokeStyle="#999";g.setLineDash([5,4]);g.strokeRect(b.x,b.y,b.w,b.h);g.setLineDash([]);return}
    g.fillStyle="#fff";g.fillRect(b.x,b.y,b.w,b.h);g.strokeStyle="#222";g.lineWidth=1.2;g.strokeRect(b.x,b.y,b.w,b.h);
    g.fillStyle="#111";g.font=F(700,b.h>40&&b.w>200?15:11);g.textAlign="center";g.textBaseline="middle";const ls=b.t.split("\n");ls.forEach((l,i)=>g.fillText(l,b.x+b.w/2,b.y+b.h/2+(i-(ls.length-1)/2)*13))});
  [1,2,3,4,5].forEach(n=>{const t=G.tags[n];g.font=F(800,10);const s="RUA "+n,w=g.measureText(s).width+10;g.fillStyle="#0a4d8c";rr(t.x,t.y,w,17,8);g.fill();g.fillStyle="#fff";g.textAlign="left";g.textBaseline="middle";g.fillText(s,t.x+5,t.y+9)});
  Object.keys(G.caps).forEach(n=>{const c=G.caps[n];g.font=F(600,11);g.fillStyle="#555";g.textAlign="left";g.textBaseline="top";g.fillText(capText(L,+n).toUpperCase(),c.x,c.y)});
  for(let v=1;v<=97;v++){const k=L.map[v];if(!k)continue;const c=CARRIERS[k],p=G.slots[v];
    g.fillStyle=c.bg;rr(p.x,p.y,SZ,SZ,6);g.fill();g.strokeStyle="rgba(0,0,0,.45)";g.lineWidth=1;g.stroke();
    g.fillStyle=c.fg;g.textAlign="center";g.textBaseline="middle";g.font=F(600,10);g.fillText(String(v),p.x+SZ/2,p.y+11);g.font=F(800,12);g.fillText(k,p.x+SZ/2,p.y+25);
    if(L.tags[v]){g.font=F(800,12);const t=shortTag(L.tags[v]),w=g.measureText(t).width+8,tp=tagPlace(v,L.tagBelow,t.length),tx=tp.left?p.x-w-4:tp.side?p.x+tp.x:p.x+tp.cx-w/2,ty=p.y+tp.y;g.fillStyle="#111";rr(tx,ty,w,16,3);g.fill();g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";g.fillText(t,tx+w/2,ty+8.5)}}
  g.restore();
  const ly=TOP+MH+22,cw=(W-PAD*2)/cols;
  legend.forEach((k,i)=>{const c=CARRIERS[k],x=PAD+(i%cols)*cw,y=ly+Math.floor(i/cols)*LEG_H;

const READ_PROMPT=`Você está lendo o desenho (print de planilha do Excel) de um layout de galpão logístico (SVC) da Kuehne+Nagel/Mercado Livre. O layout tem 97 vagas numeradas em 5 ruas:
- Rua 1: coluna mais à esquerda, vagas ímpares 1, 3, 5 ... 31
- Rua 2: coluna ao lado, vagas pares 2, 4, 6 ... 34
- Rua 3: fileira de cima, vagas 35 a 65 (da esquerda para a direita)
- Rua 4: coluna à direita (área VUC), vagas 89 a 97
- Rua 5: fileira de baixo (Expedição VUC), vagas 88 a 66 (da esquerda para a direita)
Cada vaga é um quadrado com a sigla da transportadora: AL=ALC (preto), EC=ECO EXPRESS (bege), MS=M.J SIMÕES (cinza), HW=HAWK (azul escuro), ME=MELI EXTRA (salmão), PL=PRALOG (roxo), OT=ONTIME (amarelo), PC=PARCEIRO (branco), KG=KANGU (laranja), DL=DELUNA (verde escuro), CM=COOPMETRO (verde claro), DC=DECARGO (ciano), PY (dourado).
Quadrado vermelho, com ou sem "X", é X (bloqueada). Se a sigla não estiver legível, deduza pela cor. Se o número impresso estiver repetido ou errado, siga a sequência da rua. Na coluna VUC pode haver uma célula amarela "VUC" ao lado: a sigla é a do quadrado da vaga.
Perto de algumas vagas (em cima, embaixo ou ao lado) pode estar escrito o nome da gaiola/rota, ex.: VG7_CHP, A13_SD, VC1, A14. Copie exatamente como está escrito. Ignore "Passeio", "VUC" isolado, setas, "ESTEIRA", "MEZANINO", "RAMPA".
Responda SOMENTE com um JSON neste formato:
{"titulo":"título do desenho, se houver","ciclo":"AM" | "PM" | "SD" | "AM0-CHP" | null,"vagas":{"1":"X","2":"DC","35":"PC"},"gaiolas":{"2":"A13_SD","35":"A14"},"duvidas":[11,46]}
Em "vagas" coloque todas as vagas que aparecem no desenho. Em "duvidas" os números das vagas que você não conseguiu ler com certeza.`;

function distributeRoutes(map,tags){
  const res={...tags};const used=new Set(Object.values(res).filter(Boolean));const byK={};
  planGaiolas().forEach(r=>{if(!used.has(r.g)){(byK[r.k]=byK[r.k]||[]).push(r);used.add(r.g)}});
  let placed=0,left=0;const order=v=>rua(v)===5?1000-v:v;
  Object.keys(byK).forEach(k=>{byK[k].sort((a,b)=>(a.onda||9)-(b.onda||9)||a.g.localeCompare(b.g,"pt",{numeric:true}));
    const vs=Object.keys(map).map(Number).filter(v=>map[v]===k&&!res[v]).sort((a,b)=>rua(a)-rua(b)||order(a)-order(b));
    byK[k].forEach((r,i)=>{if(vs[i]){res[vs[i]]=r.g;placed++}else left++})});
  return {tags:res,placed,left};
}

            return html`<div class="absolute pointer-events-none rounded-lg flex flex-col items-center justify-center leading-none" style=${{left:x,top:y,width:GS,height:GS,zIndex:60,background:c.bg,color:c.fg,boxShadow:"0 14px 30px rgba(0,0,0,.6),0 0 0 2px var(--amber)",transform:"rotate(-4deg)"}}>

}

function Carriers({L,filter,setFilter}){
  const g=groups(L);const max=Math.max(...Object.values(g).map(a=>a.length));
  const list=Object.keys(CARRIERS).sort((a,b)=>(g[b]||[]).length-(g[a]||[]).length);
  return html`<${Card} className="md:col-span-7" title="Transportadoras" right=${filter&&html`<${motion.button} ...${tactile} onClick=${()=>setFilter(null)} class="text-xs text-accent font-medium">Limpar filtro</${motion.button}>`}>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
      ${list.map(k=>{const n=(g[k]||[]).length;const on=filter===k;
        return html`<${motion.button} key=${k} ...${tactile} type="button" onClick=${()=>setFilter(on?null:k)} disabled=${!n}
          class=${"relative text-left rounded-2xl px-3 py-2.5 flex items-center gap-3 border transition-colors "+(on?"border-[var(--accent)] bg-white/[.07]":"border-transparent hover:bg-white/[.04]")+(n?"":" opacity-35 cursor-not-allowed")}>
          <${Swatch} k=${k}/>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between gap-2 text-sm"><span class="truncate">${CARRIERS[k].n}</span><span class="tnum text-muted font-mono text-xs">${n}</span></div>
            <div class="h-1 rounded-full bg-white/[.06] mt-1.5 overflow-hidden"><${motion.div} class="h-full rounded-full" style=${{background:k==="X"?"#ff6b6e":"var(--accent)"}}
              initial=${{width:0}} animate=${{width:(n/max*100)+"%"}} transition=${{duration:.7,ease:[.22,1,.36,1]}}/></div>
          </div>
        </${motion.button}>`})}
    </div>
  </${Card}>`;
}

function Detail({L,filter,sel}){
  const g=groups(L);let body;
  if(sel&&L.map[sel]){const k=L.map[sel];body=html`<${motion.div} key=${"v"+sel} initial=${{opacity:0,x:12}} animate=${{opacity:1,x:0}} exit=${{opacity:0,x:-12}}>
      <div class="font-display text-6xl tnum">${sel}</div>
      <div class="flex items-center gap-2 mt-3"><${Swatch} k=${k} size="lg"/><span class="text-lg font-semibold">${CARRIERS[k].n}</span></div>
      <dl class="mt-5 grid grid-cols-2 gap-y-3 text-sm">
        <dt class="text-muted">Rua</dt><dd>${area(sel)}</dd>
        <dt class="text-muted">Veículo</dt><dd>${vehOf(L,sel)}</dd>
        ${L.tags[sel]&&html`<dt class="text-muted">Código</dt><dd class="font-mono">${L.tags[sel]}</dd>`}
        <dt class="text-muted">Mesma transp.</dt><dd class="font-mono text-xs leading-relaxed">${ranges(g[k])}</dd>
      </dl></${motion.div}>`}
  else if(filter){const vs=g[filter]||[];body=html`<${motion.div} key=${"f"+filter} initial=${{opacity:0,x:12}} animate=${{opacity:1,x:0}} exit=${{opacity:0,x:-12}}>
      <div class="flex items-center gap-2"><${Swatch} k=${filter} size="lg"/><span class="text-lg font-semibold">${CARRIERS[filter].n}</span></div>
      <div class="font-display text-5xl tnum mt-4">${vs.length}<span class="text-muted text-base font-sans ml-2">vagas</span></div>
      <div class="flex flex-wrap gap-1.5 mt-5">${vs.map(v=>html`<span key=${v} class="font-mono text-xs px-2 py-1 rounded-lg bg-white/[.06] tnum">${v}</span>`)}</div></${motion.div}>`}
  else body=html`<${motion.p} key="empty" initial=${{opacity:0}} animate=${{opacity:1}} class="text-muted text-sm leading-relaxed">Toque numa vaga da planta ou numa transportadora para ver os detalhes aqui.</${motion.p}>`;
  return html`<${Card} className="md:col-span-5" title="Detalhe"><${AnimatePresence} mode="wait">${body}</${AnimatePresence}></${Card}>`;
}

function Table({cur,L}){
  const g=groups(L);const [msg,setMsg]=useState("");
  const copy=()=>{const txt=["Layout;Vaga;Rua;Sigla;Transportadora;Local;Veículo;Código"].concat(Object.keys(L.map).map(Number).sort((a,b)=>a-b).map(v=>[cur,v,"Rua "+rua(v),L.map[v],CARRIERS[L.map[v]].n,area(v),vehOf(L,v),L.tags[v]||""].join(";"))).join("\n");
    navigator.clipboard.writeText(txt).then(()=>setMsg("Copiado")).catch(()=>setMsg("Não deu para copiar aqui"));setTimeout(()=>setMsg(""),2200)};
  return html`<${Card} className="md:col-span-12" title=${"Vagas por transportadora · "+cur}
      right=${html`<div class="flex items-center gap-3"><${AnimatePresence}>${msg&&html`<${motion.span} initial=${{opacity:0,y:4}} animate=${{opacity:1,y:0}} exit=${{opacity:0}} class="text-xs text-accent">${msg}</${motion.span}>`}</${AnimatePresence}>
        <${motion.button} ...${tactile} onClick=${copy} class="text-xs font-medium px-3.5 py-2 rounded-full bg-white text-black">Copiar para Excel</${motion.button}></div>`}>
    <div class="overflow-x-auto -mx-1">
      <table class="w-full min-w-[620px] text-sm">
        <thead><tr class="text-left text-[11px] uppercase tracking-[.14em] text-muted"><th class="py-2 px-1 font-semibold">Transportadora</th><th class="py-2 px-1 font-semibold">Ruas</th><th class="py-2 px-1 font-semibold">Qtd</th><th class="py-2 px-1 font-semibold">Vagas</th></tr></thead>
        <tbody>${Object.keys(CARRIERS).filter(k=>g[k]).map(k=>html`<tr key=${k} class="border-t border-line">
          <td class="py-2.5 px-1"><div class="flex items-center gap-2"><${Swatch} k=${k}/>${CARRIERS[k].n}</div></td>
          <td class="py-2.5 px-1 text-xs whitespace-nowrap">${[...new Set(g[k].map(rua))].sort().map(r=>"Rua "+r).join(", ")}</td><td class="py-2.5 px-1 font-mono tnum">${g[k].length}</td>
          <td class="py-2.5 px-1 font-mono text-xs text-white/80 tnum">${ranges(g[k])}</td></tr>`)}</tbody>
      </table>
    </div>
    <p class="text-muted text-xs mt-4 max-w-[70ch]">X = vaga bloqueada. PY fica como PY (vaga 73 do AM e vaga 6 do PM). PRALOG não tem vaga em nenhum dos 4 layouts.</p>
  </${Card}>`;
}

const normTxt=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
const ALIASES=[["ME",["MELI EXTRA"]],["EC",["ECO EXPRESS","ECOEXPRESS"]],["MS",["SIMOES"]],["HW",["HAWK"]],["PL",["PRALOG"]],["OT",["ONTIME","ON TIME"]],["PC",["PARCEIRO"]],["KG",["KANGU"]],["DL",["DELUNA"]],["CM",["COOPMETRO"]],["DC",["DECARGO"]],["AL",["ALC"]],["PY",["PY"]]];
function matchCarrier(raw){const n=normTxt(raw);if(!n)return null;if(CARRIERS[n]&&n!=="X")return n;
  for(const [k,al] of ALIASES)if(al.some(a=>n===a||n.includes(a)))return k;return null}
const FIELDS=[
  {id:"gaiola",label:"Gaiola",re:/GAIOLA|CAGE/},
  {id:"rota",label:"Rota",re:/ROTA|ROUTE/},
  {id:"transp",label:"Transportadora",re:/TRANSP|CARRIER|EMPRESA|SIGLA|MLP/},
  {id:"onda",label:"Onda",re:/ONDA|WAVE/},
  {id:"parada",label:"Paradas",re:/PARADA|STOP/},
  {id:"saca",label:"Saca",re:/^SACA|BAG/},
  {id:"modal",label:"Modal",re:/MODAL|VEICULO/},
  {id:"bairros",label:"Bairros",re:/BAIRRO/},
  {id:"rua",label:"Rua",re:/^RUA/},
  {id:"vaga",label:"Vaga",re:/^VAGA/},
];
function guessMap(headers){const m={};const used=new Set();
  FIELDS.forEach(f=>{const h=headers.find(h=>!used.has(h)&&f.re.test(normTxt(h)));if(h){m[f.id]=h;used.add(h)}});
  if(!m.transp&&headers[0]&&!used.has(headers[0]))m.transp=headers[0];
  return m}
// acha a linha de cabeçalho (a planilha pode ter título em cima)
// planilha sem cabeçalho: descobre cada coluna pelo conteúdo
function inferHeaders(aoa){
  const data=aoa.filter(r=>r.some(c=>c));if(!data.length)return null;const n=Math.max(...data.map(r=>r.length));const smp=data.slice(0,80);
  const tests={transp:v=>!!matchCarrier(v)||/^ESVAZIAR$/i.test(v),data:v=>/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(v),
    rota:v=>/^[A-Z]{2,4}\d*_\d+(_\d+)*$/i.test(v),gaiola:v=>/^SACA$/i.test(v)||/^[A-Z]{1,3}\d+_[A-Z]{2,4}\d*$/i.test(v),
    onda:v=>/^(ONDA\s*\d+|SEM ONDA)$/i.test(v),parada:v=>/^\d{1,4}$/.test(v)};
  const names={transp:"Transportadora",data:"Data",rota:"Rota",gaiola:"Gaiola",onda:"Onda",parada:"Paradas"};
  const headers=[];const used=new Set();
  for(let i=0;i<n;i++){let bestK=null,bestR=0;Object.keys(tests).forEach(k=>{if(used.has(k))return;const vals=smp.map(r=>r[i]||"").filter(Boolean);if(!vals.length)return;
      const r=vals.filter(tests[k]).length/vals.length;if(r>bestR){bestR=r;bestK=k}});
    if(bestK&&bestR>=.6){used.add(bestK);headers.push(names[bestK])}else headers.push("Coluna "+(i+1))}
  if(!(used.has("rota")||used.has("gaiola"))||!used.has("transp"))return null;
  const rows=data.map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]??"");return o});
  return {rows,headers,title:"",headerRow:0,noHeader:true};
}
function fromAOA(aoa){
  aoa=aoa.map(r=>(r||[]).map(c=>String(c??"").trim()));
  let hi=0,best=-1;
  aoa.slice(0,20).forEach((r,i)=>{const sc=r.filter(c=>c&&FIELDS.some(f=>f.re.test(normTxt(c)))).length;if(sc>best){best=sc;hi=i}});
  if(best<2){const inf=inferHeaders(aoa);if(inf)return inf}
  const seen={};const headers=aoa[hi].map((h,i)=>{let n=h||("Coluna "+(i+1));if(seen[n])n+=" ("+(++seen[n])+")";else seen[n]=1;return n});
  const title=aoa.slice(0,hi).flat().filter(Boolean).join(" ");
  const rows=aoa.slice(hi+1).filter(r=>r.some(c=>c)).map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]??"");return o});
  return {rows,headers,title,headerRow:hi+1};
}
function detectCiclo(title,rows,m){
  const t=normTxt(title+" "+rows.slice(0,30).map(r=>(r[m.rota]||"")+" "+(r[m.gaiola]||"")).join(" "));
  if(/CHP|AM0/.test(t))return "AM0-CHP";
  if(/_SD|SD_|PLANEJAMENTO SD/.test(t))return "SD";
  if(/_PM\d?|PM\d?_|PLANEJAMENTO PM/.test(t))return "PM";
  if(/_AM\d?|AM\d?_|PLANEJAMENTO AM/.test(t))return "AM";
  return null}
const ondaNum=v=>{const d=String(v??"").match(/\d+/);return d?+d[0]:null};
const numOr=v=>{const s=String(v??"").trim();return s!==""&&!isNaN(+s)?+s:s};
function aggregate(rows,m){
  const keyOf=r=>String(r[m.rota]||r[m.gaiola]||"").trim();
  const by=new Map();
  rows.forEach(r=>{const key=keyOf(r);if(!key)return;const kk=key+"|"+normTxt(r[m.transp]);if(!by.has(kk))by.set(kk,[]);by.get(kk).push(r)});
  const items=[];
  by.forEach(list=>{const r0=list[0];const multi=list.length>1;
    const distinct=f=>m[f]?[...new Set(list.map(r=>String(r[m[f]]??"").trim()).filter(Boolean))]:[];
    let ruas=null;
    if(m.rua){const n=ondaNum(r0[m.rua]);if(n&&n<=5)ruas=[n]}
    if(!ruas&&m.vaga){const v=ondaNum(r0[m.vaga]);if(v&&v<=97)ruas=[rua(v)]}
    const bairros=m.bairros?String(r0[m.bairros]||""):"";
    const sm=normTxt(bairros).match(/ROTA MAE.*?SACAS?\s*-\s*([\d,\s]+)/);
    items.push({key:keyOf(r0),rota:m.rota?String(r0[m.rota]||"").trim():"",gaiola:m.gaiola?String(r0[m.gaiola]||"").trim():"",
      transpRaw:String(r0[m.transp]??"").trim(),k:matchCarrier(r0[m.transp]),onda:m.onda?ondaNum(r0[m.onda]):null,
      parada:multi?distinct("parada").length:numOr(m.parada?r0[m.parada]:""),
      saca:multi?(distinct("saca").length||""):(m.saca?String(r0[m.saca]||"").trim():""),
      modal:m.modal?String(r0[m.modal]||"").trim():"",bairros:sm?"":bairros,
      sacaIds:sm?sm[1].split(",").map(s=>s.trim()).filter(Boolean):[],
      pacotes:list.length,multi,ruasFix:ruas,children:[]});
  });
  // sacas (gaiola "SACA") vão para dentro da rota mãe
  const byKey=new Map(items.map(i=>[i.key,i]));const out=[];
  items.forEach(i=>{const isSaca=normTxt(i.gaiola)==="SACA";const parentKey=i.rota.replace(/_\d+$/,"");const p=byKey.get(parentKey);
    if(isSaca&&p&&p!==i)p.children.push(i);else out.push(i)});
  out.forEach(i=>i.children.sort((a,b)=>a.rota.localeCompare(b.rota,"pt",{numeric:true})));
  return out;
}

  const ondas=m.onda?[...new Set([1,2,3,4,...routes.map(r=>r.onda).filter(x=>x!=null)])].sort((a,b)=>a-b):[];
  if(!m.onda||routes.some(r=>r.onda==null))ondas.push("?");
  const byRua={1:{},2:{},3:{},4:{},5:{}};const semRua={};
  const vagaOf={};Object.entries(L.tags||{}).forEach(([v,t])=>{if(!t||L.map[v]==="V")return;const a=normTxt(t),b=normTxt(shortTag(t));if(!vagaOf[a])vagaOf[a]=+v;if(!vagaOf[b])vagaOf[b]=+v});
  const placed=routes.map(r0=>{const vv=vagaOf[normTxt(r0.gaiola)]||vagaOf[normTxt(r0.rota)];return vv?{...r0,vaga:vv,ruasFix:[rua(vv)]}:r0});
  placed.forEach(r=>{const rs=r.ruasFix||(r.k?carrierRuas(L,r.k):[]);const g=r.k||normTxt(r.transpRaw)||"SEM TRANSPORTADORA";
    if(!rs.length){(semRua[g]=semRua[g]||[]).push(r);return}
    rs.forEach(n=>{if(byRua[n])(byRua[n][g]=byRua[n][g]||[]).push(r)})});
  const ruaCount=n=>Object.values(byRua[n]).reduce((a,l)=>a+l.length,0);
  const vagasTxt=(n,k)=>ranges(Object.keys(L.map).map(Number).filter(v=>rua(v)===n&&L.map[v]===k).sort((a,b)=>a-b));
  const ruasToShow=ruaSel?[ruaSel]:[1,2,3,4,5];
  const totalSacas=routes.reduce((a,r)=>a+r.children.length,0);

  const statTile=(label,v,sub,extra,color)=>html`<${motion.section} variants=${rise} class="glass rounded-2xl px-4 py-3 col-span-1 md:col-span-3 min-w-0 relative overflow-hidden" whileHover=${{y:-2}}>
      <div class="absolute -right-8 -top-8 w-24 h-24 rounded-full pointer-events-none" style=${{background:color,filter:"blur(40px)",opacity:.14}}></div>
      <div class="flex items-baseline justify-between gap-2"><div class="text-[10px] uppercase tracking-[.14em] text-muted font-semibold">${label}</div><div class="font-display tnum leading-none tracking-tight text-xl" style=${{color}}><${CountUp} v=${v}/></div></div>
      ${sub&&html`<div class="text-muted text-[11px] mt-1">${sub}</div>`}
      ${extra}
    </${motion.section}>`;
  const totalPar=routes.reduce((a,r)=>a+(typeof r.parada==="number"?r.parada:0),0);
  const maes=routes.filter(r=>r.children.length).length;
  const carriersIn=[...new Set(routes.map(r=>r.k).filter(Boolean))];
  const porOnda=ondas.map(o=>[o,routes.filter(r=>(r.onda??"?")===o).length]);const maxO=Math.max(1,...porOnda.map(x=>x[1]));
  const cleanName=src?String(src.name).replace(/\.(csv|xlsx?|txt)$/i,"").replace(/\s*-\s*P[áa]gina\d*$/i,""):"";
  const chip=(t,tone)=>html`<span class=${"inline-flex items-center gap-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full"} style=${tone==="ok"?{background:"rgba(52,211,153,.12)",color:"#5ee6b0"}:tone==="warn"?{background:"rgba(255,181,71,.12)",color:"var(--amber)"}:{background:"rgba(255,255,255,.06)",color:"var(--muted)"}}>${tone==="ok"&&html`<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l2.5 2.5L10 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}${t}</span>`;
  const STEPS=["Lendo o arquivo","Achando o cabeçalho","Identificando o ciclo","Montando as ruas"];
  return html`<${motion.div} key="plan" variants=${stagger} initial="hidden" animate="show" class="grid grid-cols-2 md:grid-cols-12 gap-4">
    <${Card} className="col-span-2 md:col-span-7" title="Planejamento carregado">
      <div class="font-display tracking-tight leading-tight text-lg sm:text-xl" style=${{textWrap:"balance"}}>${cleanName||"Nenhum planejamento carregado"}</div>
      <div class="flex flex-wrap gap-1.5 mt-2.5">
        ${ciclo&&chip("Ciclo "+ciclo+(CICLO_TAG?" · "+CICLO_TAG:""),"")}
        ${ciclo&&(ciclo===cur?chip("Layout "+cur+" aplicado","ok"):chip("Layout aberto: "+cur,"warn"))}
        ${src&&(src.noHeader?chip("Sem cabeçalho · colunas reconhecidas pelo conteúdo","ok"):src.headerRow&&chip("Cabeçalho na linha "+src.headerRow,"ok"))}
        ${src&&chip((src.isDefault?"Enviado em ":"Importado em ")+src.at,"")}
      </div>
      ${ciclo&&ciclo!==cur&&html`<div class="mt-3 flex flex-wrap items-center gap-2 text-sm rounded-2xl px-3 py-2" style=${{background:"rgba(255,181,71,.1)",color:"var(--amber)"}}>
        Este planejamento é do ciclo ${ciclo}.
        <${motion.button} ...${tactile} type="button" onClick=${()=>setCur(ciclo)} class="font-semibold underline underline-offset-2">Voltar para o layout ${ciclo}</${motion.button}></div>`}
      ${src&&html`<div class="mt-3 pt-3 border-t border-line">
        <div class="text-[10px] uppercase tracking-[.14em] text-muted font-semibold mb-1.5">Colunas reconhecidas</div>
        <div class="flex flex-wrap gap-1.5">${FIELDS.filter(f=>m[f.id]).map(f=>html`<span key=${f.id} class="text-[11px] px-2 py-1 rounded-lg bg-white/[.05]"><span class="text-muted">${f.label}</span> <span class="font-mono">← ${m[f.id]}</span></span>`)}</div>
      </div>`}
    </${Card}>

    <${motion.section} variants=${rise} class="col-span-2 md:col-span-5 min-w-0 rounded-3xl p-[1.5px] relative overflow-hidden"
        onDragOver=${e=>{e.preventDefault();setDrag(true)}} onDragLeave=${()=>setDrag(false)} onDrop=${e=>{e.preventDefault();setDrag(false);onFile(e.dataTransfer.files[0])}}>
      <div class="absolute inset-[-60%] spin pointer-events-none" style=${{background:"conic-gradient(from 0deg,transparent 0 55%,rgba(76,195,255,.9) 70%,rgba(255,181,71,.8) 82%,transparent 95%)",opacity:drag||busy?1:.55}}></div>
      <div class="relative h-full rounded-[calc(1.5rem-1.5px)] p-4 flex flex-col" style=${{background:"rgba(12,16,21,.94)"}}>
        <div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Importar planejamento</div>
        <${AnimatePresence} mode="wait">
        ${busy?html`<${motion.div} key="busy" initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} class="flex-1 flex flex-col justify-center gap-1.5 py-2">
            ${STEPS.map((t,i)=>html`<${motion.div} key=${t} initial=${{opacity:0,x:-8}} animate=${{opacity:1,x:0}} transition=${{delay:i*.16}} class="flex items-center gap-3 text-sm">
              <${motion.span} initial=${{scale:0}} animate=${{scale:1}} transition=${{delay:i*.16+.12,type:"spring",stiffness:500,damping:20}} class="w-5 h-5 rounded-full flex items-center justify-center" style=${{background:"var(--accent)",color:"#04121b"}}>
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l2.5 2.5L10 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></${motion.span}>${t}</${motion.div}>`)}
          </${motion.div}>`
        :html`<${motion.div} key="idle" initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} class="flex-1 flex flex-col justify-center py-1">
            <div class="flex items-center gap-3">
            <${motion.div} animate=${{y:drag?-6:[0,-4,0]}} transition=${drag?{}:{repeat:Infinity,duration:2.4,ease:"easeInOut"}} class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center" style=${{background:"linear-gradient(145deg,rgba(76,195,255,.22),rgba(76,195,255,.04))",boxShadow:"inset 0 0 0 1px rgba(76,195,255,.35)"}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 16V4m0 0l-4.5 4.5M12 4l4.5 4.5" stroke="#4cc3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="#4cc3ff" stroke-width="1.8" stroke-linecap="round"/></svg>
            </${motion.div}>
            <div class="min-w-0 text-left"><div class="font-display text-sm tracking-tight">${drag?"Pode soltar":"Solte o planejamento aqui"}</div>
            <p class="text-muted text-[11px] mt-0.5">.xlsx, .xls ou .csv · abre o layout certo sozinho</p></div></div>
            <div class="flex flex-wrap items-center gap-2 mt-3">
              <${motion.label} ...${tactile} for="planFile" class="cursor-pointer text-xs font-semibold px-4 py-2 rounded-full bg-white text-black">Escolher arquivo</${motion.label}>
              <input id="planFile" type="file" accept=".xlsx,.xls,.csv,.txt" class="sr-only" onChange=${e=>{onFile(e.target.files[0]);e.target.value=""}}/>
              <${motion.button} ...${tactile} type="button" onClick=${()=>setPaste(!paste)} class="text-xs font-medium px-4 py-2 rounded-full border border-white/20">Colar do Excel</${motion.button}>
            ${src&&!src.isDefault&&html`<${motion.button} ...${tactile} type="button" onClick=${reset} class="text-xs text-muted hover:text-ink ml-1">Voltar ao AM1 de 28/09</${motion.button}>`}
            </div>
          </${motion.div}>`}
        </${AnimatePresence}>
        <${AnimatePresence}>${paste&&!busy&&html`<${motion.div} initial=${{opacity:0,height:0}} animate=${{opacity:1,height:"auto"}} exit=${{opacity:0,height:0}} class="overflow-hidden">
          <label for="pasteBox" class="block text-muted text-xs mb-2">Copie no Excel (com o cabeçalho) e cole aqui:</label>
          <textarea id="pasteBox" rows="3" class="w-full bg-white/5 border border-line rounded-2xl p-3 font-mono text-xs outline-none focus:border-[var(--accent)]" onPaste=${e=>{e.preventDefault();onPaste(e.clipboardData.getData("text"))}}></textarea>
        </${motion.div}>`}</${AnimatePresence}>
        ${err&&html`<p class="text-sm mt-2" style=${{color:"#ff8a8c"}}>${err}</p>`}
      </div>
    </${motion.section}>

    ${ReactDOM.createPortal(html`<${AnimatePresence}>${guiada&&html`<${GuiadaModal} key="g" cur=${cur} ciclo=${(CICLO_TAG||ciclo||cur)} items=${autoPlace(placed.map(r=>({...r,name:r.k&&CARRIERS[r.k]?CARRIERS[r.k].n:(r.transpRaw||"?"),rua:r.vaga?rua(r.vaga):null})),L)} onClose=${()=>setGuiada(false)}/>`}</${AnimatePresence}>`,document.body)}
    <${BuildBar} cur=${cur} onZeroPlan=${zeroPlan} hasPlan=${!!src} onGuiada=${()=>setGuiada(true)} onApplyRead=${onApplyRead} onDistribute=${onDistribute} goLayout=${goLayout}/>
    ${statTile("Rotas",routes.length,m.onda?"":"planilha sem onda",!m.onda?null:html`<div class="flex items-end gap-1 h-7 mt-1.5">${porOnda.map(([o,n])=>html`<div key=${o} class="flex-1 flex flex-col items-center gap-1 min-w-0" title=${(o==="?"?"Sem onda":"Onda "+o)+": "+n}>
        <${motion.div} class="w-full rounded-md" style=${{background:"var(--accent)",opacity:.8}} initial=${{height:0}} animate=${{height:Math.max(2,n/maxO*14)}} transition=${{duration:.8,ease:[.22,1,.36,1]}}/>
        <span class="text-[9px] text-muted tnum">${o==="?"?"s/o":"O"+o} · ${n}</span></div>`)}</div>`,"var(--ink)")}
    ${statTile("Paradas",totalPar,!m.parada?"planilha sem paradas":routes.length?"média de "+Math.round(totalPar/routes.length)+" por rota":"",null,"var(--accent)")}
    ${statTile("Sacas",totalSacas,maes?plural(maes,"rota mãe","rotas mãe"):"nenhuma rota mãe",null,"var(--amber)")}
    ${statTile("Transportadoras",carriersIn.length,"",html`<div class="flex flex-wrap gap-1 mt-1.5">${carriersIn.map(k=>html`<${Swatch} key=${k} k=${k}/>`)}</div>`,"#5ee6b0")}

    ${src&&html`<${motion.details} variants=${rise} class="col-span-2 md:col-span-12 glass rounded-2xl px-4 py-3 text-sm">
      <summary class="cursor-pointer text-muted text-xs">Colunas usadas da planilha (mude se alguma estiver errada)</summary>
      <div class="mt-3 grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-10 gap-2">
        ${FIELDS.map(f=>html`<label key=${f.id} class="text-[11px] text-muted flex flex-col gap-1 min-w-0"><span>${f.label}</span>
          <select id=${"map-"+f.id} value=${m[f.id]||""} onChange=${e=>save({...src,map:{...m,[f.id]:e.target.value||undefined}})} class="bg-white/5 border border-line rounded-lg px-2 py-1.5 text-xs text-ink">
            <option value="">— não tem —</option>${headers.map(h=>html`<option key=${h} value=${h}>${h}</option>`)}
          </select></label>`)}
      </div></${motion.details}>`}

    <${motion.div} variants=${rise} class="col-span-2 md:col-span-12 flex gap-2 overflow-x-auto noscroll">
      ${[0,1,2,3,4,5].map(n=>html`<${motion.button} key=${n} id=${"rua-"+n} ...${tactile} type="button" onClick=${()=>setRuaSel(n)}
        class=${"shrink-0 glass rounded-2xl px-4 py-2.5 text-left "+(ruaSel===n?"!border-[var(--accent)]":"")}>
        <div class="font-display text-sm">${n?"Rua "+n:"Todas"}</div>
        <div class="text-muted text-[11px] tnum">${plural(n?ruaCount(n):routes.length,"rota","rotas")}</div></${motion.button}>`)}
    </${motion.div}>

    ${ruasToShow.map(n=>{const ks=Object.keys(byRua[n]).sort((a,b)=>(CARRIERS[a]?.n||a).localeCompare(CARRIERS[b]?.n||b));
      return html`<${Card} key=${"rua"+n+cur} className="col-span-2 md:col-span-12" title=${"Rua "+n+" · "+RUA_NOME[n]}
        right=${html`<span class="text-muted text-xs tnum">${plural(ruaCount(n),"rota","rotas")} · ${plural(ks.length,"transportadora","transportadoras")}</span>`}>
        ${ks.length?html`<div class="flex flex-col gap-3">${ks.map(k=>{const other=CARRIERS[k]?carrierRuas(L,k).filter(x=>x!==n):[];const fixed=byRua[n][k].every(r=>r.ruasFix);
            return html`<${CarrierBlock} key=${k} gkey=${k} list=${byRua[n][k]} ondas=${ondas} vagas=${CARRIERS[k]?vagasTxt(n,k):""} note=${!fixed&&other.length?"também na Rua "+other.join(", "):""}/>`})}</div>`
          :html`<p class="text-muted text-sm">Nenhuma rota do planejamento cai nesta rua no layout ${cur}.</p>`}
      </${Card}>`})}

    ${!ruaSel&&Object.keys(semRua).length>0&&html`<${Card} className="col-span-2 md:col-span-12" title="Fora das ruas deste layout">
      <p class="text-muted text-sm mb-3 max-w-[70ch]">Rotas de transportadoras sem vaga no layout ${cur} (ex.: PRALOG) e as marcadas como ESVAZIAR.</p>
      <div class="flex flex-col gap-3">${Object.keys(semRua).sort().map(k=>html`<${CarrierBlock} key=${k} gkey=${k} list=${semRua[k]} ondas=${ondas}/>`)}</div>
    </${Card}>`}
  </${motion.div}>`;
}

function App(){
  let init="AM0-CHP";try{const s=localStorage.getItem("svc-tab");if(s&&LAYOUTS[s])init=s}catch(e){}
  const [cur,setCurRaw]=useState(init);const [filter,setFilter]=useState(null);const [sel,setSel]=useState(null);const [loading,setLoading]=useState(true);
  const [view,setViewRaw]=useState(()=>{try{return localStorage.getItem("svc-view")||"planta"}catch(e){return "planta"}});
  const setView=v=>{setViewRaw(v);try{localStorage.setItem("svc-view",v)}catch(e){}};
  useEffect(()=>{const t=setTimeout(()=>setLoading(false),650);return()=>clearTimeout(t)},[]);
  const setCur=k=>{if(k===cur)return;setCurRaw(k);setFilter(null);setSel(null);try{localStorage.setItem("svc-tab",k)}catch(e){}};
  const [edits,setEdits]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-edits")||"{}")}catch(e){return {}}});
  const [hist,setHist]=useState({});
  const [geos,setGeos]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-geo9")||"{}")}catch(e){return {}}});
  const [tagOv,setTagOv]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-tags")||"{}")}catch(e){return {}}});
  const storeTags=o=>{setTagOv(o);try{localStorage.setItem("svc-tags",JSON.stringify(o))}catch(e){}};
  const onTag=(v,t)=>{const cur2={...(tagOv[cur]||{}),[v]:t};storeTags({...tagOv,[cur]:cur2})};
  const storeGeos=o=>{setGeos(o);try{localStorage.setItem("svc-geo9",JSON.stringify(o))}catch(e){}};
  const storeEdits=o=>{setEdits(o);try{localStorage.setItem("svc-edits",JSON.stringify(o))}catch(e){}};
  const L=useMemo(()=>({...LAYOUTS[cur],map:edits[cur]||LAYOUTS[cur].map,geo:mergeGeo(geos[cur]),tags:(()=>{const t={...LAYOUTS[cur].tags};Object.entries(tagOv[cur]||{}).forEach(([v,x])=>{if(x)t[v]=x;else delete t[v]});return t})()}),[cur,edits,geos,tagOv]);
  const snap=()=>({map:L.map,geo:geos[cur]||null,tags:tagOv[cur]||null});
  const pushHist=()=>setHist(h=>({...h,[cur]:[...(h[cur]||[]),snap()].slice(-60)}));
  const onGeo=patch=>{pushHist();const g=geos[cur]||{};const ng={...g};["slots","blocks","tags","caps"].forEach(k=>{if(patch[k])ng[k]={...(g[k]||{}),...patch[k]}});storeGeos({...geos,[cur]:ng})};
  const onEdit=nm=>{pushHist();storeEdits({...edits,[cur]:nm})};
  const onUndo=()=>{const st=hist[cur]||[];if(!st.length)return;const prev=st[st.length-1];setHist({...hist,[cur]:st.slice(0,-1)});
    const ne={...edits};if(JSON.stringify(prev.map)===JSON.stringify(LAYOUTS[cur].map))delete ne[cur];else ne[cur]=prev.map;storeEdits(ne);
    const ng={...geos};if(prev.geo)ng[cur]=prev.geo;else delete ng[cur];storeGeos(ng);
    const nt={...tagOv};if(prev.tags)nt[cur]=prev.tags;else delete nt[cur];storeTags(nt)};
  const allV=()=>{const m={};for(let v=1;v<=97;v++)m[v]="V";return m};
  const onZero=()=>{pushHist();storeEdits({...edits,[cur]:allV()});storeTags({...tagOv,[cur]:{}})};
  const onDistribute=()=>{pushHist();const r=distributeRoutes(L.map,L.tags);storeTags({...tagOv,[cur]:r.tags});return r};
  const onApplyRead=(t,res,dist)=>{pushHist();const m=allV();Object.entries(res.vagas).forEach(([v,k])=>m[v]=k);let tags={...res.gaiolas},placed=0;
    if(dist){const r=distributeRoutes(m,tags);tags=r.tags;placed=r.placed}
    storeEdits({...edits,[t]:m});storeTags({...tagOv,[t]:tags});if(t!==cur)setCur(t);return {vagas:Object.keys(res.vagas).length,placed}};
  const onReset=()=>{pushHist();const nt={...tagOv};delete nt[cur];storeTags(nt);const ne={...edits};delete ne[cur];storeEdits(ne);const ng={...geos};delete ng[cur];storeGeos(ng)};
  const pick=v=>{setSel(v);setFilter(null)};
  const pickFilter=k=>{setFilter(k);setSel(null)};
  return html`<div>
    <${Nav} cur=${cur} setCur=${setCur} view=${view} setView=${setView}/>
    <main class="max-w-7xl mx-auto px-4 pt-32 pb-16">
      <${AnimatePresence} mode="wait">
        ${loading?html`<${motion.div} key="sk" exit=${{opacity:0}}><${Skeleton}/></${motion.div}>`
        :view==="plan"?html`<${PlanView} key="plan" cur=${cur} L=${L} setCur=${setCur} onZero=${onZero} onApplyRead=${onApplyRead} onDistribute=${onDistribute} goLayout=${()=>{setView("planta");window.scrollTo({top:0,behavior:"smooth"})}}/>`
        :html`<${motion.div} key="ok" variants=${stagger} initial="hidden" animate="show" class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <${Hero} cur=${cur} L=${L}/>
            <${Search} L=${L} onPick=${pick}/>
            <${Plant} cur=${cur} L=${L} filter=${filter} sel=${sel} onPick=${pick} onEdit=${onEdit} onGeo=${onGeo} onTag=${onTag} onZero=${onZero} onApplyRead=${onApplyRead} onDistribute=${onDistribute} onUndo=${onUndo} onReset=${onReset} canUndo=${(hist[cur]||[]).length>0} edited=${!!edits[cur]||!!geos[cur]||!!(tagOv[cur]&&Object.keys(tagOv[cur]).length)}/>
            <${Carriers} L=${L} filter=${filter} setFilter=${pickFilter}/>
            <${Detail} L=${L} filter=${filter} sel=${sel}/>
            <${Table} cur=${cur} L=${L}/>
          </${motion.div}>`}
      </${AnimatePresence}>
    </main>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</html>
